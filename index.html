<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ========================= -->
    <!-- Basic Meta -->
    <!-- ========================= -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>ComplyNG 🇳🇬 — Learn Nigerian Compliance Through Gameplay</title>

    <meta
      name="description"
      content="Master Nigerian business compliance laws through immersive gameplay. Choose your career, navigate real laws, earn XP, unlock achievements, and become a Compliance Legend."
    />

    <meta
      name="keywords"
      content="Nigeria, compliance, business law, legal game, fintech, startup laws, CAC, tax laws, compliance training, gamification"
    />

    <meta name="author" content="ComplyNG Team" />
    <meta name="theme-color" content="#008751" />
    <meta name="color-scheme" content="light dark" />

    <!-- ========================= -->
    <!-- PWA -->
    <!-- ========================= -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ComplyNG" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- ========================= -->
    <!-- Open Graph / WhatsApp -->
    <!-- ========================= -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ComplyNG 🇳🇬" />
    <meta
      property="og:description"
      content="Can you survive Nigerian business compliance laws? Play ComplyNG — real laws, real gameplay, AI advisor, XP rewards."
    />
    <meta property="og:site_name" content="ComplyNG" />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:image:alt" content="ComplyNG Game Preview" />

    <!-- ========================= -->
    <!-- Twitter / X -->
    <!-- ========================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ComplyNG 🇳🇬" />
    <meta
      name="twitter:description"
      content="Learn Nigerian compliance law through gameplay. Beat my score and become a Compliance Legend."
    />
    <meta name="twitter:image" content="/preview.png" />

    <!-- ========================= -->
    <!-- Fonts -->
    <!-- ========================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ========================= -->
    <!-- Global Styles -->
    <!-- ========================= -->
    <style>
      :root {
        --primary: #008751;
        --secondary: #ffffff;
        --background: #081c15;
        --text: #f5f5f5;
        --accent: #00c773;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        font-family: "Inter", sans-serif;
        background: var(--background);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body {
        position: relative;
      }

      /* ========================= */
      /* Animated Background */
      /* ========================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at top left, rgba(0, 199, 115, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(0, 135, 81, 0.2), transparent 30%);
        z-index: -1;
      }

      /* ========================= */
      /* Loading Screen */
      /* ========================= */

      #loader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #081c15, #0b2e22);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        animation: pulse 1.8s infinite ease-in-out;
      }

      .loader-text {
        font-size: 1.1rem;
        font-weight: 600;
        color: #d9fff0;
        letter-spacing: 0.5px;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(0, 199, 115, 0.4);
        }
        70% {
          transform: scale(1.05);
          box-shadow: 0 0 0 20px rgba(0, 199, 115, 0);
        }
        100% {
          transform: scale(1);
        }
      }

      /* ========================= */
      /* Root App */
      /* ========================= */

      #root {
        min-height: 100vh;
      }

      /* ========================= */
      /* Scrollbar */
      /* ========================= */

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(0, 199, 115, 0.5);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ========================= */
      /* Selection */
      /* ========================= */

      ::selection {
        background: rgba(0, 199, 115, 0.3);
      }
    </style>
  </head>

  <body>
    <!-- ========================= -->
    <!-- Loading Screen -->
    <!-- ========================= -->

    <div id="loader">
      <div class="loader-logo">🇳🇬</div>
      <div class="loader-text">Loading ComplyNG...</div>
    </div>

    <!-- ========================= -->
    <!-- React Root -->
    <!-- ========================= -->

    <div id="root"></div>

    <!-- ========================= -->
    <!-- Main App -->
    <!-- ========================= -->

    <script type="module" src="/src/main.jsx"></script>

    <!-- ========================= -->
    <!-- App Startup -->
    <!-- ========================= -->

    <script>
      // Hide loader when app finishes loading
      window.addEventListener("load", () => {
        const loader = document.getElementById("loader");

        setTimeout(() => {
          loader.classList.add("hidden");
        }, 700);

        // Register service worker
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .register("/sw.js")
            .catch(() => {});
        }
      });
    </script>

    <!-- ========================= -->
    <!-- No JS Fallback -->
    <!-- ========================= -->

    <noscript>
      <style>
        #loader {
          display: none;
        }

        body {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 2rem;
          text-align: center;
        }

        .noscript-message {
          max-width: 500px;
        }
      </style>

      <div class="noscript-message">
        <h1>JavaScript Required</h1>
        <p>
          ComplyNG requires JavaScript to run properly. Please enable JavaScript
          in your browser and refresh the page.
        </p>
      </div>
    </noscript>
  </body>
</html>
```
